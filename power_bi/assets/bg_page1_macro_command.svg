<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Deep Space Navy Base Canvas -->
    <rect width="1920" height="1080" fill="#0B111E"/>

    <!-- TOP HEADER BANNER (Golden & Cyan Glowing Header Frame) -->
    <rect x="24" y="20" width="1872" height="74" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>

    <!-- Header Title Reference (Two-Tone Text Matching Your Image) -->
    <text x="960" y="66" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" letter-spacing="2">
        <tspan fill="#FACC15">UNIT ECONOMICS ANALYSIS </tspan>
        <tspan fill="#94A3B8">| </tspan>
        <tspan fill="#38BDF8">URBANCART FULFILLMENT</tspan>
    </text>

    <!-- LEFT CONTROL PILLAR (Brand & Slicer Container) -->
    <rect x="24" y="108" width="230" height="948" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>

    <!-- Slicer Card Slots inside Left Pillar (Glowing Dropdown Holders) -->
    <!-- Slicer 1: Year -->
    <rect x="40" y="270" width="198" height="72" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Slicer 2: Quarter -->
    <rect x="40" y="360" width="198" height="72" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Slicer 3: Product Category -->
    <rect x="40" y="450" width="198" height="72" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Slicer 4: City -->
    <rect x="40" y="540" width="198" height="72" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Slicer 5: Customer Loyalty Tier -->
    <rect x="40" y="630" width="198" height="72" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>

    <!-- Page Switcher Buttons (Bottom of Left Pillar) -->
    <rect x="40" y="870" width="198" height="42" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="139" y="897" text-anchor="middle" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">PAGE 2: LOGISTICS SLA ➔</text>
    <rect x="40" y="924" width="198" height="42" rx="8" fill="#151E32" stroke="#233354" stroke-width="1"/>
    <text x="139" y="951" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">PAGE 3: WHAT-IF SIM ➔</text>

    <!-- TOP ROW: 4 HORIZONTAL KPI CARDS (Matching Your Image Layout) -->
    <!-- Card 1: GMV -->
    <rect x="274" y="108" width="388" height="140" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>
    <!-- Card 2: Net Realized Sales -->
    <rect x="682" y="108" width="388" height="140" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>
    <!-- Card 3: CM2 Variable Profit -->
    <rect x="1090" y="108" width="388" height="140" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>
    <!-- Card 4: Orders Delivered & Return Rate -->
    <rect x="1498" y="108" width="398" height="140" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>

    <!-- MIDDLE ROW: 2 PRIMARY CHARTS (Matching Your Image Layout) -->
    <!-- Left Chart: Sales & Margin Trend by Month -->
    <rect x="274" y="266" width="796" height="400" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>
    <!-- Right Chart: Weekly / Hub Orders Volume -->
    <rect x="1090" y="266" width="806" height="400" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>

    <!-- BOTTOM ROW: 3 TACTICAL VISUALS (Matching Your Image Layout) -->
    <!-- Bottom Left: Category Performance Matrix -->
    <rect x="274" y="684" width="520" height="372" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>
    <!-- Bottom Center: Top Darkstores by Profit -->
    <rect x="814" y="684" width="530" height="372" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>
    <!-- Bottom Right: Payment Processing Leakage -->
    <rect x="1364" y="684" width="532" height="372" rx="14" fill="#151E32" stroke="#233354" stroke-width="1.5"/>
</svg>
